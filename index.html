<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AK's Expense Tracker</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:20px;background:#f6f5ef;color:#222}button,input,select{padding:10px;margin:4px;border-radius:7px;border:1px solid #ccc}button{background:#222;color:#fff;cursor:pointer}.card{background:#fff;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 1px 5px #ddd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.kpi{font-size:22px;font-weight:bold}.muted{color:#666;font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>AK's Expense Tracker</h1><p class="muted">Mobile-friendly personal expense tracker</p><div id="app"></div><script>const C=window.EXPENSE_APP_CONFIG||{};let sb,uid,rows=[];const cats=['Bike Fuel','Car Fuel','Food / Eating Outside','Misc','Health Check-up / Medicine','Car EMI','Other EMI','WiFi Recharge','Cab / Auto','Groceries','Shopping','Entertainment','Insurance','Other'];function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function esc(x){return String(x||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}async function start(){if(!C.SUPABASE_URL){auth();return}sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);const {data}=await sb.auth.getUser();if(data.user){uid=data.user.id;await load();}else auth()}function auth(){document.getElementById('app').innerHTML='<div class="card"><h2>Sign in</h2><input id="em" placeholder="Email" type="email"><input id="pw" placeholder="Password" type="password"><br><button onclick="login()">Sign in</button><button onclick="signup()">Create account</button><p class="muted">First deployment requires Supabase configuration. See README.</p></div>'}async function login(){let r=await sb.auth.signInWithPassword({email:em.value,password:pw.value});if(r.error)alert(r.error.message);else start()}async function signup(){let r=await sb.auth.signUp({email:em.value,password:pw.value});alert(r.error?r.error.message:'Account created. Check email if confirmation is required.')}async function load(){let r=await sb.from('expenses').select('*').order('date',{ascending:false});if(r.error){alert(r.error.message);return}rows=r.data||[];render()}function render(){let total=rows.reduce((a,x)=>a+Number(x.amount),0),month=new Date().toISOString().slice(0,7),mt=rows.filter(x=>x.date.startsWith(month)).reduce((a,x)=>a+Number(x.amount),0);document.getElementById('app').innerHTML='<div class="grid"><div class="card"><div class="muted">All-time expense</div><div class="kpi">'+money(total)+'</div></div><div class="card"><div class="muted">This month</div><div class="kpi">'+money(mt)+'</div></div><div class="card"><div class="muted">Transactions</div><div class="kpi">'+rows.length+'</div></div></div><div class="card"><h2>Add expense</h2><input id="dt" type="date" value="'+new Date().toISOString().slice(0,10)+'"><input id="amt" type="number" placeholder="Amount ₹"><select id="cat">'+cats.map(x=>'<option>'+x+'</option>').join('')+'</select><input id="des" placeholder="Description"><select id="pay"><option>UPI</option><option>Credit Card</option><option>Debit Card</option><option>Cash</option><option>Bank Transfer</option><option>Auto Debit</option></select><button onclick="add()">Save expense</button></div><div class="card"><h2>Recent transactions</h2><table><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr>'+rows.slice(0,30).map(x=>'<tr><td>'+x.date+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.description)+'</td><td>'+money(x.amount)+'</td></tr>').join('')+'</table></div>'}async function add(){let amount=Number(amt.value);if(!amount)return alert('Enter amount');let r=await sb.from('expenses').insert({user_id:uid,date:dt.value,category:cat.value,subcategory:cat.value,description:des.value,amount,payment_mode:pay.value});if(r.error)alert(r.error.message);else{amt.value='';des.value='';await load()}}start()</script></body></html>
