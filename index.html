<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--ink:#20241d;--muted:#70736a;--paper:#f6f5ef;--card:#fff;--line:#dddcd2;--gold:#a87934;--green:#476347;--red:#8d3c34;--amber:#b08b3d;--blue:#536f88}*{box-sizing:border-box}body{margin:0;background:#ecebe5;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:1180px;margin:auto;min-height:100vh;background:#fff}.top{background:var(--ink);color:#fff;padding:18px 16px 14px}.brand{font:700 24px Georgia,serif}.sub{font-size:12px;color:#c6c8bd;margin-top:3px}.nav{position:sticky;top:0;z-index:10;background:#e0e0d7;border-bottom:1px solid #ccc;padding:7px;display:flex;gap:5px;overflow:auto}.nav button{border:0;background:transparent;color:#5d6058;padding:9px 12px;border-radius:8px;white-space:nowrap}.nav button.active{background:var(--ink);color:#fff}.main{padding:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.label,.section{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}.value{font:700 21px ui-monospace,monospace;margin-top:5px}.muted{font-size:12px;color:var(--muted)}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field label{display:block;font-size:12px;font-weight:650;color:#5a5d55;margin-bottom:5px}.input,.select{width:100%;padding:11px;border:1px solid #c9c9bf;border-radius:9px;background:#fff;color:var(--ink)}.span2{grid-column:1/-1}.btn{border:0;border-radius:9px;background:var(--ink);color:#fff;padding:10px 14px;font-weight:700}.btn.secondary{background:#fff;color:var(--ink);border:1px solid #c8c8bf}.btn.danger{background:var(--red)}.btn.gold{background:var(--gold)}.actions{display:flex;gap:7px;flex-wrap:wrap}.monthbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}.monthbar button{padding:7px 11px}.progress{height:9px;border-radius:8px;background:#e3e3da;overflow:hidden}.progress>i{display:block;height:100%;background:var(--gold);border-radius:8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px;font-size:12px}.table th{font-size:9px;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px;border-bottom:1px solid var(--line)}.table td{padding:8px 7px;border-bottom:1px solid #e6e6dd}.right{text-align:right}.badge{display:inline-block;border-radius:20px;padding:3px 7px;font-size:9px;font-weight:800}.fixed{background:#efe1c4;color:#73511e}.variable{background:#dce8d8;color:#3e603d}.non{background:#f1d9d5;color:#873a32}.uncertain{background:#e6e5dc;color:#606158}.notice{padding:10px 12px;border-radius:9px;background:#efe1c4;border:1px solid #dbc48d;font-size:12px;margin-bottom:12px}.notice.ok{background:#dce8d8;border-color:#b8cdb2}.notice.err{background:#f1d9d5;border-color:#d9aaa4}.empty{color:var(--muted);padding:12px 0}.hero{background:linear-gradient(135deg,#f4efe4,#f7f6f0);border:1px solid #ded7c8}.big{font:700 28px ui-monospace,monospace}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.search{max-width:320px}.bottom{display:none}.hide{display:none!important}@media(max-width:650px){.main{padding:9px}.top{padding:15px}.brand{font-size:21px}.form{grid-template-columns:1fr}.span2{grid-column:auto}.mini-grid{grid-template-columns:1fr}.nav{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid #ccc;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;font-size:10px;color:#666;display:flex;flex-direction:column;gap:3px;align-items:center}.bottom button.active{color:var(--ink);font-weight:800}.bottom .addbtn{background:var(--ink);color:#fff;border-radius:50%;width:44px;height:44px;justify-content:center;font-size:18px;margin-top:-22px}.main{padding-bottom:78px}}

</head><body><div id="root"></div><script>
const C=window.EXPENSE_APP_CONFIG||{};let sb,user,rows=[],settings={budget:50000,catBudgets:{},overrides:{},upcoming:[]},tab='dashboard',month=mk(new Date()),editId=null;
const CATS={Transportation:['Bike Fuel','Car Fuel','Cab / Auto','Metro / Bus','Parking / Toll','Vehicle Service','Vehicle Repairs','Vehicle Insurance'],Food:['Eating Outside','Restaurants / Cafes','Coffee / Snacks','Food Delivery','Groceries'],Housing:['Rent','Electricity','WiFi','Mobile Recharge','Gas','Maintenance'],EMIs:['Car EMI','Bike EMI','Personal Loan EMI','Home Loan EMI','Credit Card Payment','Other EMI'],Health:['Health Check-up','Doctor Consultation','Medicine','Dental','Tests / Diagnostics','Other Health'],Personal:['Clothing','Grooming / Salon','Personal Care','Accessories'],Entertainment:['Movies','OTT','Outings','Travel','Hobbies','Events'],Shopping:['Electronics','Household','Online Shopping','Gifts','Other Shopping'],Family:['Parents','Family Expenses','Family Outings','Gifts'],Professional:['Work Travel','Work Meals','Courses / Learning','Professional Subscriptions'],Financial:['Insurance','Bank Charges','Credit Card Charges','Taxes'],Miscellaneous:['Miscellaneous']};
const PAY=['UPI','Credit Card','Debit Card','Cash','Bank Transfer','Auto Debit','Other'];const TYPES=['Auto','Fixed Recurring','Variable Recurring','Non-Recurring','Uncertain'];
const $=id=>document.getElementById(id),money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN'),mk=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')},ml=m=>{let [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})},shift=(m,n)=>{let [y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+n,1);return mk(d)},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(t,c=''){$('notice').innerHTML=t?'<div class="notice '+c+'">'+esc(t)+'</div>':''}
async function start(){if(!C.SUPABASE_URL){auth('Supabase configuration missing.');return}sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user)load();else auth()});let r=await sb.auth.getUser();if(r.data.user){user=r.data.user;await load()}else auth()}
function auth(msg=''){document.body.innerHTML='<div style="max-width:430px;margin:50px auto;padding:18px"><div class="card"><div class="brand">AK\'s Expense Tracker</div><p class="muted">Private cloud expense tracker</p><div id="authnotice"></div><div class="field"><label>Email</label><input id="em" class="input" type="email"></div><div class="field" style="margin-top:9px"><label>Password</label><input id="pw" class="input" type="password"></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="login()">Sign in</button><button class="btn secondary" onclick="signup()">Create account</button></div></div></div>';if(msg)$('authnotice').innerHTML='<div class="notice err">'+esc(msg)+'</div>'}
async function login(){let r=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(r.error)$('authnotice').innerHTML='<div class="notice err">'+esc(r.error.message)+'</div>'}
async function signup(){let r=await sb.auth.signUp({email:$('em').value,password:$('pw').value});$('authnotice').innerHTML=r.error?'<div class="notice err">'+esc(r.error.message)+'</div>':'<div class="notice ok">Account created. Check your email if confirmation is required.</div>'}
async function load(){let r=await sb.from('expenses').select('*').order('date',{ascending:true});if(r.error){auth(r.error.message);return}rows=r.data||[];let s=await sb.from('settings').select('*').eq('user_id',user.id).maybeSingle();if(s.data){settings={...settings,...s.data};settings.catBudgets=s.data.cat_budgets||{};settings.overrides=s.data.overrides||{};settings.upcoming=s.data.upcoming||[]}render()}
async function saveSettings(){let payload={user_id:user.id,budget:Number(settings.budget)||0,cat_budgets:settings.catBudgets||{},overrides:settings.overrides||{},upcoming:settings.upcoming||[],updated_at:new Date().toISOString()};let r=await sb.from('settings').upsert(payload);if(r.error)notice('Settings table is not ready yet. Run the SQL migration supplied with this upgrade. Your expense entries still work.','err')}
function classify(){let months=[...new Set(rows.map(x=>mk(x.date)))].sort(), groups={};rows.forEach(x=>{let k=x.category+'|'+x.subcategory;groups[k]??={cat:x.category,sub:x.subcategory,vals:{}};let m=mk(x.date);groups[k].vals[m]=(groups[k].vals[m]||0)+Number(x.amount)});let out={};Object.entries(groups).forEach(([k,g])=>{let vals=Object.values(g.vals),avg=vals.reduce((a,b)=>a+b,0)/(vals.length||1),sd=Math.sqrt(vals.reduce((a,b)=>a+(b-avg)**2,0)/(vals.length||1)),presence=vals.length/(months.length||1),auto='Non-Recurring';if(vals.length>=2&&presence>=.5)auto=sd/Math.max(avg,1)<=.18?'Fixed Recurring':'Variable Recurring';else if(vals.length>=2&&presence>=.34)auto='Variable Recurring';let final=settings.overrides[k]||auto;out[k]={...g,avg,vals,presence,auto,final,last:vals[vals.length-1]||0,recent:vals.slice(-3).reduce((a,b)=>a+b,0)/(Math.min(3,vals.length)||1),months:vals.length,allMonths:months.length};});return out}
function filtered(m=month){return rows.filter(x=>mk(x.date)===m)}
function nav(){return '<div class="nav">'+[['dashboard','Dashboard'],['add','Add Expense'],['transactions','Transactions'],['analysis','Analysis'],['forecast','Forecast'],['settings','Settings']].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div><div class="bottom">'+[['dashboard','⌂','Home'],['transactions','≡','Txns'],['add','＋','Add'],['analysis','◒','Analysis'],['forecast','↗','Forecast']].map(x=>'<button class="'+(tab===x[0]?'active':'')+(x[0]==='add'?' addbtn':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span><span>'+x[2]+'</span></button>').join('')+'</div>'}
function go(t){tab=t;editId=null;render();window.scrollTo(0,0)}
function dashboard(){let m=filtered(),total=m.reduce((a,x)=>a+Number(x.amount),0),cm=classify(),fix=m.filter(x=>cm[x.category+'|'+x.subcategory]?.final==='Fixed Recurring').reduce((a,x)=>a+Number(x.amount),0),vr=m.filter(x=>cm[x.category+'|'+x.subcategory]?.final==='Variable Recurring').reduce((a,x)=>a+Number(x.amount),0),non=total-fix-vr,budget=Number(settings.budget)||0,remain=budget-total;let cat={};m.forEach(x=>cat[x.category]=(cat[x.category]||0)+Number(x.amount));let top=Object.entries(cat).sort((a,b)=>b[1]-a[1]);let prev=filtered(shift(month,-1)).reduce((a,x)=>a+Number(x.amount),0);return '<div class="monthbar"><button class="btn secondary" onclick="month=shift(month,-1);render()">←</button><b>'+ml(month)+'</b><button class="btn secondary" onclick="month=shift(month,1);render()">→</button></div><div class="grid kpis"><div class="card"><div class="label">This month</div><div class="value">'+money(total)+'</div></div><div class="card"><div class="label">Fixed recurring</div><div class="value">'+money(fix)+'</div></div><div class="card"><div class="label">Variable recurring</div><div class="value">'+money(vr)+'</div></div><div class="card"><div class="label">Non-recurring</div><div class="value">'+money(non)+'</div></div><div class="card"><div class="label">Budget remaining</div><div class="value" style="color:'+(remain<0?'var(--red)':'var(--green)')+'">'+money(remain)+'</div></div></div><div class="card hero"><div class="row"><div><div class="label">Monthly budget</div><div class="big">'+money(budget)+'</div></div><div class="right"><div class="label">Vs last month</div><b style="color:'+(total>prev?'var(--red)':'var(--green)')+'">'+(prev?((total-prev)/prev*100).toFixed(1):'0')+'%</b></div></div><div class="progress" style="margin-top:12px"><i style="width:'+Math.min(100,budget?total/budget*100:0)+'%"></i></div><p class="muted">'+(budget?Math.min(100,total/budget*100).toFixed(0)+'% of budget used.':'Set a monthly budget in Settings.')+'</p></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><div class="section">Top categories</div>'+top.slice(0,7).map(x=>'<div style="margin:10px 0"><div class="row"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div><div class="progress"><i style="width:'+Math.min(100,total?x[1]/total*100:0)+'%"></i></div></div>').join('')+(top.length?'':'<div class="empty">No expenses this month.</div>')+'</div><div class="card"><div class="section">Quick insight</div><p>'+insight(total,prev,top,fix,vr,non)+'</p><div class="actions"><button class="btn gold" onclick="go(\'add\')">+ Add expense</button><button class="btn secondary" onclick="go(\'forecast\')">View forecast</button></div></div></div>'}
function insight(total,prev,top,fix,vr,non){if(!total)return 'Start adding your daily expenses. After a few weeks, the tracker will begin building useful recurring and forecast insights.';if(prev&&total>prev*1.1)return 'Your spending is up <b>'+((total-prev)/prev*100).toFixed(1)+'%</b> versus last month. '+(top[0]?'The largest category is <b>'+esc(top[0][0])+'</b> at '+money(top[0][1])+'.':'');if(fix>total*.6)return 'More than 60% of this month\'s spending is classified as fixed recurring commitments. Your biggest opportunity for flexibility is in variable and discretionary spending.';if(non>total*.3)return 'Over 30% of this month\'s spending is non-recurring. Check the Analysis tab to see which one-offs are driving the month.';return 'Your spending pattern looks relatively stable. Keep logging consistently so the forecast becomes more reliable.'}
function add(){let e=editId?rows.find(x=>x.id===editId):null;return '<div class="card" style="max-width:650px;margin:auto"><div class="section">'+(e?'Edit expense':'Add expense')+'</div><form onsubmit="saveExpense(event)"><div class="form"><div class="field"><label>Date</label><input id="dt" class="input" type="date" value="'+(e?e.date:new Date().toISOString().slice(0,10))+'" required></div><div class="field"><label>Amount (₹)</label><input id="amt" class="input" type="number" step="0.01" min="0.01" value="'+(e?e.amount:'')+'" required autofocus></div><div class="field"><label>Category</label><select id="cat" class="select" onchange="subs()" required><option value="">Select</option>'+Object.keys(CATS).map(c=>'<option '+(e&&e.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="field"><label>Sub-category</label><select id="sub" class="select" required></select></div><div class="field"><label>Description</label><input id="des" class="input" value="'+esc(e?.description||'')+'" placeholder="e.g. Petrol / dinner / medicine"></div><div class="field"><label>Payment mode</label><select id="pay" class="select">'+PAY.map(p=>'<option '+(e?.payment_mode===p?'selected':'')+'>'+p+'</option>').join('')+'</select></div><div class="field"><label>Type</label><select id="typ" class="select">'+TYPES.map(t=>'<option '+((e?getType(e):'Auto')===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="field span2"><label>Notes</label><input id="notes" class="input" value="'+esc(e?.notes||'')+'"></div></div><div class="actions" style="margin-top:13px"><button class="btn">'+(e?'Update expense':'Save expense')+'</button>'+(e?'<button type="button" class="btn secondary" onclick="go(\'transactions\')">Cancel</button>':'')+'</div></form></div>'}
function subs(){let c=$('cat')?.value;if(!$('sub'))return;$('sub').innerHTML='<option value="">Select</option>'+(CATS[c]||[]).map(s=>'<option>'+s+'</option>').join('')}
function getType(e){let c=classify()[e.category+'|'+e.subcategory];return settings.overrides[e.category+'|'+e.subcategory]||c?.auto||'Uncertain'}
async function saveExpense(ev){ev.preventDefault();let row={user_id:user.id,date:$('dt').value,category:$('cat').value,subcategory:$('sub').value,description:$('des').value,amount:Number($('amt').value),payment_mode:$('pay').value,notes:$('notes').value};let r=editId?await sb.from('expenses').update(row).eq('id',editId):await sb.from('expenses').insert(row);if(r.error)return alert(r.error.message);let chosen=$('typ').value,key=row.category+'|'+row.subcategory;if(chosen==='Auto')delete settings.overrides[key];else settings.overrides[key]=chosen;await saveSettings();await load();go('dashboard')}
function transactions(){return '<div class="card"><div class="row"><div><div class="section">Transactions</div><div class="muted">'+rows.length+' total records</div></div><button class="btn gold" onclick="go(\'add\')">+ Add</button></div><div class="form" style="margin-top:12px"><div><input id="search" class="input" placeholder="Search description/category" oninput="filterTx()"></div><div><select id="txmonth" class="select" onchange="filterTx()"><option value="all">All months</option>'+[...new Set(rows.map(x=>mk(x.date)))].sort().reverse().map(m=>'<option value="'+m+'" '+(m===month?'selected':'')+'>'+ml(m)+'</option>').join('')+'</select></div></div><div id="txbody" class="tablewrap" style="margin-top:10px"></div></div>'}
function filterTx(){let q=($('search')?.value||'').toLowerCase(),m=$('txmonth')?.value||'all',arr=rows.filter(x=>(m==='all'||mk(x.date)===m)&&((x.description||'').toLowerCase().includes(q)||(x.category||'').toLowerCase().includes(q)||(x.subcategory||'').toLowerCase().includes(q)));$('txbody').innerHTML='<table class="table"><thead><tr><th>Date</th><th>Category</th><th>Sub</th><th>Description</th><th>Amount</th><th>Type</th><th></th></tr></thead><tbody>'+arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{let t=getType(e),cl=t==='Fixed Recurring'?'fixed':t==='Variable Recurring'?'variable':t==='Non-Recurring'?'non':'uncertain';return '<tr><td>'+e.date+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.subcategory)+'</td><td>'+esc(e.description||'—')+'</td><td>'+money(e.amount)+'</td><td><span class="badge '+cl+'">'+t+'</span></td><td><div class="actions"><button class="btn secondary" style="padding:4px 7px" onclick="edit(\''+e.id+'\')">Edit</button><button class="btn danger" style="padding:4px 7px" onclick="del(\''+e.id+'\')">×</button></div></td></tr>'}).join('')+'</tbody></table>'+(arr.length?'':'<div class="empty">No matching transactions.</div>')}
function edit(id){editId=id;tab='add';render()}async function del(id){if(!confirm('Delete this expense?'))return;let r=await sb.from('expenses').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}
function analysis(){let m=filtered(),total=m.reduce((a,x)=>a+Number(x.amount),0),cm=classify(),b={};m.forEach(x=>{let t=getType(x);b[t]=(b[t]||0)+Number(x.amount)});let cats={};m.forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));let top=Object.entries(cats).sort((a,b)=>b[1]-a[1]);return '<div class="monthbar"><button class="btn secondary" onclick="month=shift(month,-1);render()">←</button><b>'+ml(month)+'</b><button class="btn secondary" onclick="month=shift(month,1);render()">→</button></div><div class="grid kpis">'+['Fixed Recurring','Variable Recurring','Non-Recurring'].map(t=>'<div class="card"><div class="label">'+t+'</div><div class="value">'+money(b[t]||0)+'</div><div class="muted">'+(total?((b[t]||0)/total*100).toFixed(1):0)+'% of month</div></div>').join('')+'</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><div class="section">Category analysis</div>'+top.map(x=>'<div style="margin:10px 0"><div class="row"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div><div class="progress"><i style="width:'+Math.min(100,total?x[1]/total*100:0)+'%"></i></div></div>').join('')+'</div><div class="card"><div class="section">6-month trend</div>'+trend()+'</div></div><div class="card"><div class="section">Recurring rules</div><p class="muted">The tracker classifies a sub-category as Fixed Recurring when it appears in at least half of the months and its amount is relatively stable. Variable Recurring has repeated monthly presence with greater variation. You can override any classification below.</p>'+Object.entries(cm).sort((a,b)=>b[1].avg-a[1].avg).map(([k,c])=>'<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span><b>'+esc(c.sub)+'</b><br><span class="muted">'+esc(c.cat)+' · '+c.months+'/'+c.allMonths+' months · avg '+money(c.avg)+'</span></span><select class="select" style="max-width:170px" onchange="setOverride('+JSON.stringify(k)+',this.value)"><option value="">Auto: '+c.auto+'</option>'+TYPES.slice(1).map(t=>'<option '+(settings.overrides[k]===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div>').join('')+'</div>'}
function trend(){let ms=[];for(let i=5;i>=0;i--)ms.push(shift(month,-i));let vals=ms.map(m=>filtered(m).reduce((a,x)=>a+Number(x.amount),0)),mx=Math.max(...vals,1);return ms.map((m,i)=>'<div style="margin:9px 0"><div class="row"><span>'+ml(m).split(' ')[0]+'</span><b>'+money(vals[i])+'</b></div><div class="progress"><i style="width:'+vals[i]/mx*100+'%"></i></div></div>').join('')}
async function setOverride(k,v){if(v)settings.overrides[k]=v;else delete settings.overrides[k];await saveSettings();render()}
function forecast(){let cm=classify(),fixed=0,variable=0;Object.values(cm).forEach(c=>{if(c.final==='Fixed Recurring')fixed+=c.last;if(c.final==='Variable Recurring')variable+=c.recent});let upcoming=settings.upcoming||[],known=upcoming.reduce((a,x)=>a+Number(x.amount),0),base=fixed+variable,plan=(base+known)*1.05;return '<div class="card hero"><div class="label">Next month planning requirement</div><div class="big">'+money(plan)+'</div><p class="muted">Forecast = fixed recurring + recent variable average + known upcoming expenses, plus a 5% planning buffer.</p></div><div class="grid kpis"><div class="card"><div class="label">Fixed recurring</div><div class="value">'+money(fixed)+'</div></div><div class="card"><div class="label">Variable forecast</div><div class="value">'+money(variable)+'</div></div><div class="card"><div class="label">Known upcoming</div><div class="value">'+money(known)+'</div></div><div class="card"><div class="label">Baseline</div><div class="value">'+money(base+known)+'</div></div></div><div class="card"><div class="section">Known upcoming / one-off expenses</div>'+upcoming.map((u,i)=>'<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>'+esc(u.description)+'</span><span><b>'+money(u.amount)+'</b> <button class="btn danger" style="padding:4px 7px" onclick="removeUp('+i+')">×</button></span></div>').join('')+'<div class="form" style="margin-top:10px"><input id="updesc" class="input" placeholder="e.g. Car service"><input id="upamt" class="input" type="number" placeholder="Amount ₹"></div><button class="btn secondary" style="margin-top:8px" onclick="addUp()">Add upcoming</button></div><div class="card"><div class="section">Affordability check</div><p class="muted">Use this before a discretionary purchase.</p><div class="form"><input id="purchase" class="input" type="number" placeholder="Planned purchase ₹"><input id="safe" class="input" type="number" placeholder="Available buffer ₹"></div><button class="btn" style="margin-top:8px" onclick="afford()">Check</button><div id="affmsg" style="margin-top:10px"></div></div>'}
async function addUp(){let d=$('updesc').value,a=Number($('upamt').value);if(!d||!a)return;settings.upcoming.push({description:d,amount:a});await saveSettings();render()}async function removeUp(i){settings.upcoming.splice(i,1);await saveSettings();render()}function afford(){let p=Number($('purchase').value),b=Number($('safe').value);$('affmsg').innerHTML=p<=b?'<div class="notice ok">Comfortable: this purchase fits within the buffer you entered.</div>':p<=b*1.25?'<div class="notice">Possible, but it will materially reduce your buffer.</div>':'<div class="notice err">Not recommended based on the buffer entered.</div>'}
function settingsPage(){let total=rows.reduce((a,x)=>a+Number(x.amount),0);return '<div class="card"><div class="section">Monthly budget</div><div class="form"><div><label class="muted">Overall budget</label><input class="input" type="number" value="'+settings.budget+'" onchange="settings.budget=Number(this.value);saveSettings()"></div><div><div class="label">All-time expense</div><div class="value">'+money(total)+'</div></div></div></div><div class="card"><div class="section">Category budgets</div>'+Object.keys(CATS).map(c=>'<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>'+c+'</span><input class="input" style="max-width:150px" type="number" value="'+(settings.catBudgets[c]||0)+'" onchange="settings.catBudgets['+JSON.stringify(c)+']=Number(this.value);saveSettings()"></div>').join('')+'</div><div class="card"><div class="section">Data</div><div class="actions"><button class="btn secondary" onclick="exportCSV()">Export CSV</button><button class="btn secondary" onclick="exportJSON()">Export JSON</button><button class="btn danger" onclick="signout()">Sign out</button></div><p class="muted">Your expense rows are stored in Supabase and isolated by login.</p></div>'}
function exportCSV(){let h='Date,Category,Subcategory,Description,Amount,Payment Mode,Notes\n',b=rows.map(x=>[x.date,x.category,x.subcategory,x.description||'',x.amount,x.payment_mode||'',x.notes||''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');download(h+b,'ak-expenses.csv','text/csv')}
function exportJSON(){download(JSON.stringify(rows,null,2),'ak-expenses.json','application/json')}function download(s,n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}async function signout(){await sb.auth.signOut()}
function render(){if(!user)return;let body=tab==='dashboard'?dashboard():tab==='add'?add():tab==='transactions'?transactions():tab==='analysis'?analysis():tab==='forecast'?forecast():settingsPage();document.body.innerHTML='<div class="app"><div class="top"><div class="brand">AK\'s Expense Tracker</div><div class="sub">Personal finance · '+esc(user.email)+'</div></div>'+nav()+'<main class="main"><div id="notice"></div>'+body+'</main></div>';if(tab==='transactions')filterTx();if(tab==='add'){subs();if(editId){let e=rows.find(x=>x.id===editId);if(e&&$('sub'))$('sub').value=e.subcategory||''}}}
start();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
