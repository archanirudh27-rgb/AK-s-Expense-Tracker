<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20241d"><title>AK's Expense Tracker</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>:root{--ink:#20241d;--muted:#70736a;--bg:#efeee8;--line:#dddcd2;--gold:#a87934;--green:#476347;--red:#8d3c34}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:1100px;margin:auto;background:#fff;min-height:100vh}.top{background:var(--ink);color:#fff;padding:18px}.brand{font:700 25px Georgia,serif}.sub{font-size:12px;color:#c8c9c1;margin-top:4px}.nav{display:flex;gap:5px;padding:7px;background:#e2e2d9;position:sticky;top:0;z-index:5;overflow:auto}.nav button,.bottom button{border:0;background:transparent;padding:9px 12px;border-radius:8px;white-space:nowrap;color:#5e6159}.nav .active{background:var(--ink);color:#fff}.main{padding:12px}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.card{background:#f7f6f0;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.label,.section{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:800}.value{font:700 21px ui-monospace,monospace;margin-top:5px}.big{font:700 29px ui-monospace,monospace}.muted{font-size:12px;color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#5c5e57}.input,.select{width:100%;padding:11px;border:1px solid #c8c8bf;border-radius:9px;background:#fff;color:var(--ink)}.typebox{border:1px solid #c8c8bf;border-radius:9px;background:#fff;padding:10px}.typebox label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:800}.btn.secondary{background:#fff;color:var(--ink);border:1px solid #c8c8bf}.btn.gold{background:var(--gold)}.btn.danger{background:var(--red)}.actions{display:flex;gap:7px;flex-wrap:wrap}.monthbar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}.monthbar button{padding:7px 11px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:9px;background:#e2e2d9;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold)}.tablewrap{overflow:auto}.table{width:100%;min-width:760px;border-collapse:collapse;font-size:12px}.table th{font-size:9px;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:7px}.table td{padding:8px 7px;border-bottom:1px solid #e7e6df}.badge{font-size:9px;font-weight:800;border-radius:20px;padding:4px 7px;white-space:nowrap}.fixed{background:#efe1c4;color:#73511e}.variable{background:#dce8d8;color:#3e603d}.non{background:#f1d9d5;color:#873a32}.uncertain{background:#e5e5dd;color:#606158}.empty{color:var(--muted);padding:15px 0}.notice{padding:10px 12px;border-radius:9px;background:#efe1c4;border:1px solid #dbc48d;font-size:12px;margin-bottom:12px}.notice.ok{background:#dce8d8;border-color:#b8cdb2}.notice.err{background:#f1d9d5;border-color:#d9aaa4}.hero{background:linear-gradient(135deg,#f4efe4,#faf9f3)}.bottom{display:none}@media(max-width:650px){.nav{display:none}.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ccc;z-index:10;justify-content:space-around;padding:6px 3px calc(6px + env(safe-area-inset-bottom))}.bottom button{font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px}.bottom .add{background:var(--ink);color:#fff;border-radius:50%;width:43px;height:43px;justify-content:center;margin-top:-19px;font-size:17px}.main{padding:9px 9px 80px}.top{padding:15px}.brand{font-size:21px}.form{grid-template-columns:1fr}.card{padding:13px}}</style></head><body><div id="root"></div><script>
const cfg=window.EXPENSE_APP_CONFIG||{};const TYPES=['Auto Detect','Fixed Recurring','Variable Recurring','Non-Recurring','Uncertain'];const CATS={Transportation:['Bike Fuel','Car Fuel','Cab / Auto','Metro / Bus','Parking / Toll','Vehicle Service','Vehicle Repairs','Vehicle Insurance'],Food:['Eating Outside','Restaurants / Cafes','Coffee / Snacks','Food Delivery','Groceries'],Housing:['Rent','Electricity','WiFi','Mobile Recharge','Gas','Maintenance'],EMIs:['Car EMI','Bike EMI','Personal Loan EMI','Home Loan EMI','Credit Card Payment','Other EMI'],Health:['Health Check-up','Doctor Consultation','Medicine','Dental','Tests / Diagnostics','Other Health'],Personal:['Clothing','Grooming / Salon','Personal Care','Accessories'],Entertainment:['Movies','OTT','Outings','Travel','Hobbies','Events'],Shopping:['Electronics','Household','Online Shopping','Gifts','Other Shopping'],Family:['Parents','Family Expenses','Family Outings','Gifts'],Professional:['Work Travel','Work Meals','Courses / Learning','Professional Subscriptions'],Financial:['Insurance','Bank Charges','Credit Card Charges','Taxes'],Miscellaneous:['Miscellaneous']};const PAY=['UPI','Credit Card','Debit Card','Cash','Bank Transfer','Auto Debit','Other'];let sb=null,user=null,rows=[],page='home',editId=null,month='';const $=id=>document.getElementById(id);const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');function monthOf(v){let d=new Date(v);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function monthLabel(m){let[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}function moveMonth(m,n){let[y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function key(e){return(e.category||'Miscellaneous')+'|'+(e.subcategory||e.category||'Miscellaneous')}function typeMap(){return JSON.parse(localStorage.getItem('ak_expense_types_'+(user?.id||'x') )||'{}')}function saveTypeMap(m){localStorage.setItem('ak_expense_types_'+user.id,JSON.stringify(m))}function autoType(e){let all=[...new Set(rows.map(x=>monthOf(x.date)))].sort(),k=key(e),vals=all.map(m=>rows.filter(x=>monthOf(x.date)===m&&key(x)===k).reduce((a,x)=>a+Number(x.amount),0)).filter(v=>v>0);if(vals.length<2)return'Non-Recurring';let avg=vals.reduce((a,b)=>a+b,0)/vals.length,sd=Math.sqrt(vals.reduce((a,b)=>a+(b-avg)**2,0)/vals.length),presence=vals.length/Math.max(all.length,1);if(presence>=.6&&sd/Math.max(avg,1)<=.18)return'Fixed Recurring';if(presence>=.4)return'Variable Recurring';return'Non-Recurring'}function typeFor(e){let map=typeMap();return e.expense_type||map[e.id]||autoType(e)}function monthly(m){return rows.filter(x=>monthOf(x.date)===m)}
function auth(msg=''){document.body.innerHTML='<div style="max-width:430px;margin:50px auto;padding:18px"><div class="card"><div class="brand">AK\'s Expense Tracker</div><p class="muted">Private cloud expense tracker</p><div id="an">'+(msg?'<div class="notice err">'+esc(msg)+'</div>':'')+'</div><div class="field"><label>Email</label><input id="email" class="input" type="email"></div><div class="field" style="margin-top:9px"><label>Password</label><input id="pass" class="input" type="password"></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="login()">Sign in</button><button class="btn secondary" onclick="signup()">Create account</button></div></div></div>'}async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error)$('an').innerHTML='<div class="notice err">'+esc(r.error.message)+'</div>'}async function signup(){let r=await sb.auth.signUp({email:$('email').value,password:$('pass').value});$('an').innerHTML=r.error?'<div class="notice err">'+esc(r.error.message)+'</div>':'<div class="notice ok">Account created. Check your email if confirmation is required.</div>'}async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){auth('Supabase configuration is missing.');return}sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user)load();else auth()});let r=await sb.auth.getUser();if(r.data.user){user=r.data.user;load()}else auth()}async function load(){let r=await sb.from('expenses').select('*').order('date',{ascending:false});if(r.error){auth(r.error.message);return}rows=r.data||[];if(!month)month=monthOf(new Date());render()}
function nav(){let items=[['home','Home'],['add','Add Expense'],['tx','Transactions'],['analysis','Analysis'],['forecast','Forecast'],['settings','Settings']];return'<div class="nav">'+items.map(x=>'<button class="'+(page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div><div class="bottom">'+[['home','⌂','Home'],['tx','≡','Txns'],['add','＋','Add'],['analysis','◒','Analysis'],['forecast','↗','Forecast']].map(x=>'<button class="'+(page===x[0]?'active':'')+(x[0]==='add'?' add':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span><span>'+x[2]+'</span></button>').join('')+'</div>'}function go(p){page=p;editId=null;render();scrollTo(0,0)}function budget(){return Number(localStorage.getItem('ak_budget_'+user.id)||50000)}function setBudget(v){localStorage.setItem('ak_budget_'+user.id,String(Number(v)||0))}
function home(){let a=monthly(month),total=a.reduce((s,x)=>s+Number(x.amount),0),b=budget(),fix=0,vari=0,non=0;a.forEach(x=>{let t=typeFor(x);if(t==='Fixed Recurring')fix+=Number(x.amount);else if(t==='Variable Recurring')vari+=Number(x.amount);else non+=Number(x.amount)});let cats={};a.forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));let top=Object.entries(cats).sort((x,y)=>y[1]-x[1]),prev=monthly(moveMonth(month,-1)).reduce((s,x)=>s+Number(x.amount),0),pct=b?total/b*100:0;return'<div class="monthbar"><button class="btn secondary" onclick="month=moveMonth(month,-1);render()">←</button><b>'+monthLabel(month)+'</b><button class="btn secondary" onclick="month=moveMonth(month,1);render()">→</button></div><div class="grid kpis"><div class="card"><div class="label">This month</div><div class="value">'+money(total)+'</div></div><div class="card"><div class="label">Fixed recurring</div><div class="value">'+money(fix)+'</div></div><div class="card"><div class="label">Variable recurring</div><div class="value">'+money(vari)+'</div></div><div class="card"><div class="label">Non-recurring</div><div class="value">'+money(non)+'</div></div><div class="card"><div class="label">Budget remaining</div><div class="value" style="color:'+(b-total<0?'var(--red)':'var(--green)')+'">'+money(b-total)+'</div></div></div><div class="card hero"><div class="row"><div><div class="label">Monthly budget</div><div class="big">'+money(b)+'</div></div><div><div class="label">Vs last month</div><b style="color:'+(total>prev?'var(--red)':'var(--green)')+'">'+(prev?((total-prev)/prev*100).toFixed(1):'0')+'%</b></div></div><div class="progress" style="margin-top:12px"><i style="width:'+Math.min(100,pct)+'%"></i></div><div class="muted" style="margin-top:6px">'+pct.toFixed(0)+'% of budget used</div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><div class="section">Top categories</div>'+(top.length?top.slice(0,8).map(x=>'<div style="margin:10px 0"><div class="row"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div><div class="progress"><i style="width:'+Math.min(100,total?x[1]/total*100:0)+'%"></i></div></div>').join(''):'<div class="empty">No expenses this month.</div>')+'</div><div class="card"><div class="section">Quick insight</div><p>'+(total?'Largest category: <b>'+esc(top[0]?.[0]||'—')+'</b> at '+money(top[0]?.[1]||0)+'. '+(prev?'This month is '+(total>prev?'higher':'lower')+' than last month by '+money(Math.abs(total-prev))+'.':'Keep logging expenses to build a trend.'):'Start logging daily expenses. The tracker will build recurring and forecast insights over time.')+'</p><button class="btn gold" onclick="go(\'add\')">+ Add expense</button></div></div>'}
function add(){let e=editId?rows.find(x=>x.id===editId):null,cats=Object.keys(CATS),selected=e?typeFor(e):'Auto Detect';return'<div class="card" style="max-width:700px;margin:auto"><div class="section">'+(e?'Edit expense':'Add expense')+'</div><form onsubmit="saveExpense(event)"><div class="form"><div class="field"><label>Date</label><input id="date" class="input" type="date" value="'+(e?e.date:new Date().toISOString().slice(0,10))+'" required></div><div class="field"><label>Amount (₹)</label><input id="amount" class="input" type="number" min="0.01" step="0.01" value="'+(e?e.amount:'')+'" required></div><div class="field"><label>Category</label><select id="category" class="select" onchange="fillSubs()" required><option value="">Select category</option>'+cats.map(c=>'<option '+(e&&e.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="field"><label>Sub-category</label><select id="subcategory" class="select" required><option value="">Select sub-category</option></select></div><div class="field"><label>Description</label><input id="description" class="input" value="'+esc(e?.description||'')+'" placeholder="e.g. Petrol / dinner"></div><div class="field"><label>Payment mode</label><select id="payment" class="select">'+PAY.map(p=>'<option '+(e?.payment_mode===p?'selected':'')+'>'+p+'</option>').join('')+'</select></div><div class="field span2"><div class="typebox"><label>Expense Type</label><select id="expenseType" class="select">'+TYPES.map(t=>'<option '+(selected===t?'selected':'')+'>'+t+'</option>').join('')+'</select><div class="muted" style="margin-top:5px">Auto Detect classifies from your spending history. You can override it manually.</div></div></div></div><div class="actions" style="margin-top:13px"><button class="btn">'+(e?'Update expense':'Save expense')+'</button>'+(e?'<button type="button" class="btn secondary" onclick="go(\'tx\')">Cancel</button>':'')+'</div></form></div>'}
function fillSubs(){let c=$('category')?.value;if(!$('subcategory'))return;$('subcategory').innerHTML='<option value="">Select sub-category</option>'+(CATS[c]||[]).map(s=>'<option>'+s+'</option>').join('');let e=editId&&rows.find(x=>x.id===editId);if(e)$('subcategory').value=e.subcategory||''}
async function saveExpense(ev){ev.preventDefault();let chosen=$('expenseType').value,row={user_id:user.id,date:$('date').value,amount:Number($('amount').value),category:$('category').value,subcategory:$('subcategory').value,description:$('description').value,payment_mode:$('payment').value};if(chosen!=='Auto Detect')row.expense_type=chosen;let r=editId?await sb.from('expenses').update(row).eq('id',editId):await sb.from('expenses').insert(row);if(r.error&&row.expense_type){delete row.expense_type;r=editId?await sb.from('expenses').update(row).eq('id',editId):await sb.from('expenses').insert(row)}if(r.error){alert(r.error.message);return}if(chosen!=='Auto Detect'){let m=typeMap();if(editId)m[editId]=chosen;else{let q=await sb.from('expenses').select('*').eq('user_id',user.id).eq('date',row.date).eq('amount',row.amount).eq('category',row.category).eq('subcategory',row.subcategory).order('created_at',{ascending:false}).limit(1);if(q.data?.[0]?.id)m[q.data[0].id]=chosen}saveTypeMap(m)}else if(editId){let m=typeMap();delete m[editId];saveTypeMap(m)}await load();go('home')}
function tx(){return'<div class="card"><div class="row"><div><div class="section">Transactions</div><div class="muted">'+rows.length+' records</div></div><button class="btn gold" onclick="go(\'add\')">+ Add</button></div><div class="form" style="margin-top:12px"><input id="q" class="input" placeholder="Search" oninput="filterTx()"><select id="tm" class="select" onchange="filterTx()"><option value="all">All months</option>'+[...new Set(rows.map(x=>monthOf(x.date)))].sort().reverse().map(m=>'<option value="'+m+'" '+(m===month?'selected':'')+'>'+monthLabel(m)+'</option>').join('')+'</select></div><div id="txlist" class="tablewrap" style="margin-top:10px"></div></div>'}function filterTx(){let q=($('q')?.value||'').toLowerCase(),m=$('tm')?.value||'all',a=rows.filter(x=>(m==='all'||monthOf(x.date)===m)&&((x.description||'').toLowerCase().includes(q)||(x.category||'').toLowerCase().includes(q)||(x.subcategory||'').toLowerCase().includes(q)));$('txlist').innerHTML=a.length?'<table class="table"><thead><tr><th>Date</th><th>Category</th><th>Sub-category</th><th>Description</th><th>Amount</th><th>Type</th><th></th></tr></thead><tbody>'+a.map(e=>{let t=typeFor(e),cl=t==='Fixed Recurring'?'fixed':t==='Variable Recurring'?'variable':t==='Uncertain'?'uncertain':'non';return'<tr><td>'+e.date+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.subcategory||'—')+'</td><td>'+esc(e.description||'—')+'</td><td>'+money(e.amount)+'</td><td><span class="badge '+cl+'">'+t+'</span></td><td><button class="btn secondary" style="padding:4px 7px" onclick="edit(\''+e.id+'\')">Edit</button> <button class="btn danger" style="padding:4px 7px" onclick="del(\''+e.id+'\')">×</button></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">No matching transactions.</div>'}function edit(id){editId=id;page='add';render()}async function del(id){if(!confirm('Delete this expense?'))return;let r=await sb.from('expenses').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}
function analysis(){let a=monthly(month),total=a.reduce((s,x)=>s+Number(x.amount),0),bucket={'Fixed Recurring':0,'Variable Recurring':0,'Non-Recurring':0,'Uncertain':0},cats={};a.forEach(x=>{let t=typeFor(x);bucket[t]=(bucket[t]||0)+Number(x.amount);cats[x.category]=(cats[x.category]||0)+Number(x.amount)});let top=Object.entries(cats).sort((x,y)=>y[1]-x[1]),months=[];for(let i=5;i>=0;i--)months.push(moveMonth(month,-i));let vals=months.map(m=>monthly(m).reduce((s,x)=>s+Number(x.amount),0)),mx=Math.max(...vals,1);return'<div class="monthbar"><button class="btn secondary" onclick="month=moveMonth(month,-1);render()">←</button><b>'+monthLabel(month)+'</b><button class="btn secondary" onclick="month=moveMonth(month,1);render()">→</button></div><div class="grid kpis">'+Object.entries(bucket).map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+money(x[1])+'</div><div class="muted">'+(total?(x[1]/total*100).toFixed(1):0)+'%</div></div>').join('')+'</div><div class="card"><div class="section">Category analysis</div>'+top.map(x=>'<div style="margin:10px 0"><div class="row"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div><div class="progress"><i style="width:'+Math.min(100,total?x[1]/total*100:0)+'%"></i></div></div>').join('')+'</div><div class="card"><div class="section">6-month trend</div>'+months.map((m,i)=>'<div style="margin:9px 0"><div class="row"><span>'+monthLabel(m).split(' ')[0]+'</span><b>'+money(vals[i])+'</b></div><div class="progress"><i style="width:'+vals[i]/mx*100+'%"></i></div></div>').join('')+'</div><div class="card"><div class="section">Recurring detection</div><p class="muted">Fixed Recurring: repeated in at least 60% of tracked months with relatively stable amounts. Variable Recurring: repeated in at least 40% of months with greater variation. With limited history, the tracker stays conservative.</p></div>'}
function forecast(){let all=[...new Set(rows.map(x=>monthOf(x.date)))].sort(),cm=all.slice(-3),groups={};rows.forEach(x=>{let k=key(x);groups[k]??=[];groups[k].push(x)});let fixed=0,variable=0;Object.values(groups).forEach(g=>{let t=typeFor(g[0]),vals=cm.map(m=>g.filter(x=>monthOf(x.date)===m).reduce((s,x)=>s+Number(x.amount),0)).filter(v=>v>0);if(t==='Fixed Recurring'&&vals.length)fixed+=vals[vals.length-1];if(t==='Variable Recurring'&&vals.length)variable+=vals.reduce((s,v)=>s+v,0)/vals.length});let baseline=fixed+variable,buffer=baseline*.05;return'<div class="card hero"><div class="label">Next-month baseline forecast</div><div class="big">'+money(baseline)+'</div><p class="muted">Fixed recurring commitments plus recent variable recurring spending.</p></div><div class="grid kpis"><div class="card"><div class="label">Fixed commitments</div><div class="value">'+money(fixed)+'</div></div><div class="card"><div class="label">Variable forecast</div><div class="value">'+money(variable)+'</div></div><div class="card"><div class="label">5% planning buffer</div><div class="value">'+money(buffer)+'</div></div><div class="card"><div class="label">Suggested minimum</div><div class="value">'+money(baseline+buffer)+'</div></div></div><div class="card"><div class="section">Affordability check</div><div class="form"><div><label class="muted">Planned purchase ₹</label><input id="purchase" class="input" type="number"></div><div><label class="muted">Available extra buffer ₹</label><input id="extra" class="input" type="number"></div></div><button class="btn" style="margin-top:10px" onclick="afford()">Check</button><div id="aff" style="margin-top:10px"></div></div>'}function afford(){let p=Number($('purchase').value),b=Number($('extra').value);$('aff').innerHTML=p<=b?'<div class="notice ok">Comfortable — it fits within the buffer entered.</div>':p<=b*1.25?'<div class="notice">Possible, but it will materially reduce your buffer.</div>':'<div class="notice err">Not recommended based on the buffer entered.</div>'}
function settings(){return'<div class="card"><div class="section">Monthly budget</div><div class="form"><div><label class="muted">Budget ₹</label><input id="budget" class="input" type="number" value="'+budget()+'"></div><div><label class="muted">All-time expense</label><div class="value">'+money(rows.reduce((s,x)=>s+Number(x.amount),0))+'</div></div></div><button class="btn" style="margin-top:10px" onclick="setBudget($(\'budget\').value);alert(\'Budget saved\')">Save budget</button></div><div class="card"><div class="section">Data backup</div><div class="actions"><button class="btn secondary" onclick="csv()">Export CSV</button><button class="btn secondary" onclick="json()">Export JSON</button><button class="btn danger" onclick="sb.auth.signOut()">Sign out</button></div><p class="muted">Expenses remain in Supabase and are separated by login.</p></div>'}function download(data,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}function csv(){let h='Date,Category,Subcategory,Description,Amount,Payment Mode,Expense Type\n',b=rows.map(x=>[x.date,x.category,x.subcategory||'',x.description||'',x.amount,x.payment_mode||'',typeFor(x)].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');download(h+b,'ak-expenses.csv','text/csv')}function json(){download(JSON.stringify(rows,null,2),'ak-expenses.json','application/json')}
function render(){if(!user)return;let body=page==='home'?home():page==='add'?add():page==='tx'?tx():page==='analysis'?analysis():page==='forecast'?forecast():settings();document.body.innerHTML='<div class="app"><div class="top"><div class="brand">AK\'s Expense Tracker</div><div class="sub">Personal finance · '+esc(user.email)+'</div></div>'+nav()+'<main class="main">'+body+'</main></div>';if(page==='tx')filterTx();if(page==='add'){fillSubs();let e=editId&&rows.find(x=>x.id===editId);if(e)$('subcategory').value=e.subcategory||''}}init();</script></body></html>
