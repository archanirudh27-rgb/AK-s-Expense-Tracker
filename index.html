<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.webmanifest?v=29">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./runtime-config.js?v=29"></script>
<style>
:root{--bg:#f2f1eb;--surface:#fff;--card:#f8f7f2;--ink:#171b17;--muted:#74786f;--line:#deddd4;--gold:#b9822e;--gold2:#d9aa55;--green:#3f6947;--red:#9a453c;--nav:#e7e6df;--shadow:0 10px 30px rgba(22,25,21,.06)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink)}body.dark{--bg:#0d100d;--surface:#111511;--card:#1a1f1a;--ink:#f3f4ef;--muted:#a4aaa1;--line:#303630;--gold:#d19a42;--gold2:#e0b767;--green:#71a67b;--red:#d4776d;--nav:#151a15;--shadow:0 12px 30px rgba(0,0,0,.2)}
button,input,select{font:inherit}.app{max-width:1180px;margin:auto;background:var(--surface);min-height:100vh}.top{background:linear-gradient(135deg,#0d100d,#20251e);color:#fff;padding:16px 20px}.toprow{display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;border-radius:10px}.wordmark{font-size:25px;font-weight:800;letter-spacing:-.05em}.wordmark span{color:var(--gold2)}.subtitle{font-size:11px;color:#c8ccc5;margin-top:5px}.theme{margin-left:auto;border:1px solid #4a5149;background:#232923;color:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:700;cursor:pointer}.nav{display:flex;gap:4px;padding:8px;background:var(--nav);position:sticky;top:0;z-index:20;overflow:auto;border-bottom:1px solid var(--line)}.nav button,.bottom button{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px;white-space:nowrap;cursor:pointer}.nav button.active{background:var(--ink);color:var(--surface)}.main{padding:14px}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 12%,var(--card)),var(--card))}.label,.section{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:800}.value{font-size:22px;font-weight:800;margin-top:5px}.big{font-size:31px;font-weight:800;letter-spacing:-.03em}.muted{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.monthbar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--ink);color:var(--surface);font-weight:800;cursor:pointer}.btn.gold{background:var(--gold);color:white}.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--red);color:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px;color:var(--muted)}.input,.select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink)}.typebox{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:11px}.span2{grid-column:1/-1}.progress{height:9px;background:color-mix(in srgb,var(--muted) 20%,transparent);border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold);border-radius:10px}.tablewrap{overflow:auto}.table{width:100%;min-width:760px;border-collapse:collapse;font-size:12px}.table th{font-size:9px;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:8px}.table td{padding:9px 8px;border-bottom:1px solid var(--line)}.badge{font-size:9px;font-weight:800;border-radius:999px;padding:4px 7px;display:inline-block}.fixed{background:#efe1c4;color:#6f4d18}.variable{background:#dbe8d7;color:#345a37}.non{background:#f1d9d5;color:#82382f}.income{background:#d9e8dc;color:#315938}.investment{background:#ece0c8;color:#6d4d1b}.empty{padding:16px 0;color:var(--muted)}.notice{padding:10px 12px;border-radius:10px;background:#eee2c8;border:1px solid #d7c08d;font-size:12px}.notice.ok{background:#dce9dc;border-color:#b9cdb8}.notice.err{background:#f0d8d4;border-color:#d8aba5}.bottom{display:none}.score{font-size:34px;font-weight:800}.settings-list{display:grid;gap:8px}.settings-item{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
@media(max-width:700px){.app{max-width:none}.top{padding:13px 14px}.brand img{width:32px;height:32px}.wordmark{font-size:21px}.subtitle{font-size:9px}.nav{display:none}.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;justify-content:space-around;padding:5px 2px calc(5px + env(safe-area-inset-bottom))}.bottom button{font-size:9px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 6px}.bottom button.active{color:var(--gold);font-weight:800}.bottom .add{background:var(--ink);color:var(--surface);border-radius:12px;min-width:58px}.main{padding:10px 9px 82px}.form{grid-template-columns:1fr}.span2{grid-column:auto}.card{padding:13px}.theme{padding:7px 9px;font-size:10px}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div id="root"></div>
<script>
const cfg=window.EXPENSE_APP_CONFIG||{};
const TYPES=['Auto Detect','Fixed Recurring','Variable Recurring','Non-Recurring','Uncertain'];
const BASE_CATS={Transportation:['Bike Fuel','Car Fuel','Cab / Auto','Metro / Bus','Parking / Toll','Vehicle Service','Vehicle Repairs','Vehicle Insurance'],Food:['Eating Outside','Restaurants / Cafes','Coffee / Snacks','Food Delivery','Groceries'],Housing:['Rent','Electricity','WiFi','Mobile Recharge','Gas','Maintenance'],EMIs:['Car EMI','Bike EMI','Personal Loan EMI','Home Loan EMI','Credit Card Payment','Other EMI'],Health:['Health Check-up','Doctor Consultation','Medicine','Dental','Tests / Diagnostics','Other Health'],Personal:['Clothing','Grooming / Salon','Personal Care','Accessories'],Entertainment:['Movies','OTT','Outings','Travel','Hobbies','Events'],Shopping:['Electronics','Household','Online Shopping','Gifts','Other Shopping'],Family:['Parents','Family Expenses','Family Outings','Gifts'],Professional:['Work Travel','Work Meals','Courses / Learning','Professional Subscriptions'],Financial:['Insurance','Bank Charges','Credit Card Charges','Taxes'],Investment:['Gold','SIP','Shares','Mutual Funds','Bonds','Other Investments'],Miscellaneous:['Miscellaneous']};
const BASE_PAY=['UPI','Credit Card','Debit Card','Cash','Bank Transfer','Auto Debit','Other'];
const INCOME_TYPES=['Salary','Freelance / Professional','Business','Bonus','Interest','Rental Income','Other Income'];
let sb=null,user=null,rows=[],editId=null,month='';
const validPages=['home','tx','add','income','forecast','settings'];
let page=new URLSearchParams(location.search).get('action')==='add'?'add':(validPages.includes(localStorage.getItem('fintrack_last_page'))?localStorage.getItem('fintrack_last_page'):'home');
const $=id=>document.getElementById(id), money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function monthOf(v){const d=new Date(v+'T00:00:00');return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthLabel(m){const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function moveMonth(m,n){const[y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function isIncome(x){return x.category==='Income'} function isInvestment(x){return x.category==='Investment'} function ordinary(x){return !isIncome(x)&&!isInvestment(x)}
function monthly(m){return rows.filter(x=>monthOf(x.date)===m&&ordinary(x))} function incomeMonthly(m){return rows.filter(x=>monthOf(x.date)===m&&isIncome(x))} function investmentMonthly(m){return rows.filter(x=>monthOf(x.date)===m&&isInvestment(x))}
function total(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}
function key(e){return(e.category||'Miscellaneous')+'|'+(e.subcategory||e.category||'Miscellaneous')}
function typeMap(){try{return JSON.parse(localStorage.getItem('fintrack_types_'+(user?.id||'x'))||'{}')}catch(e){return{}}}
function saveTypeMap(m){localStorage.setItem('fintrack_types_'+user.id,JSON.stringify(m))}
function autoType(e){if(!ordinary(e))return isIncome(e)?'Income':'Investment';const months=[...new Set(rows.filter(ordinary).map(x=>monthOf(x.date)))].sort(),k=key(e),vals=months.map(m=>rows.filter(x=>ordinary(x)&&monthOf(x.date)===m&&key(x)===k).reduce((a,x)=>a+Number(x.amount),0)).filter(v=>v>0);if(vals.length<2)return'Non-Recurring';const avg=vals.reduce((a,b)=>a+b,0)/vals.length,sd=Math.sqrt(vals.reduce((a,b)=>a+(b-avg)**2,0)/vals.length),presence=vals.length/Math.max(months.length,1);if(presence>=.6&&sd/Math.max(avg,1)<=.18)return'Fixed Recurring';if(presence>=.4)return'Variable Recurring';return'Non-Recurring'}
function typeFor(e){if(isIncome(e))return'Income';if(isInvestment(e))return'Investment';return e.expense_type||typeMap()[e.id]||autoType(e)}
function setupKey(){return'fintrack_setup_'+(user?.id||'guest')}
function readSetup(){try{return JSON.parse(localStorage.getItem(setupKey())||'{"cats":{},"payments":[]}')}catch(e){return{cats:{},payments:[]}}}
function getCats(){const c=JSON.parse(JSON.stringify(BASE_CATS)),s=readSetup();Object.entries(s.cats||{}).forEach(([k,v])=>{c[k]=c[k]||[];v.forEach(x=>{if(!c[k].includes(x))c[k].push(x)})});return c}
function getPay(){const s=readSetup();return [...BASE_PAY,...(s.payments||[]).filter(x=>!BASE_PAY.includes(x))]}
function setTheme(dark){document.body.classList.toggle('dark',dark);localStorage.setItem('fintrack_theme',dark?'dark':'light');const b=$('themeBtn');if(b)b.textContent=dark?'☀ Light':'☾ Dark'}
function toggleTheme(){setTheme(!document.body.classList.contains('dark'))}
setTheme(localStorage.getItem('fintrack_theme')==='dark');
function go(p){if(!validPages.includes(p))p='home';page=p;editId=null;localStorage.setItem('fintrack_last_page',p);render();scrollTo(0,0)}
function header(){return`<div class="top"><div class="toprow"><div class="brand"><img src="./fintrack-icon-192.svg?v=29" alt="FinTrack"><div class="wordmark">Fin<span>Track</span></div></div><button id="themeBtn" class="theme" onclick="toggleTheme()">${document.body.classList.contains('dark')?'☀ Light':'☾ Dark'}</button></div><div class="subtitle">Personal Finance · Cash Flow · Planning${user?' · '+esc(user.email):''}</div></div>`}
function nav(){const items=[['home','Home'],['add','Add Expense'],['tx','Transactions'],['forecast','Forecast'],['settings','Settings'],['income','Income']];const mobile=[['home','⌂','Home'],['tx','≡','Txns'],['add','＋','Add'],['income','₹','Income'],['forecast','↗','Forecast'],['settings','⚙','More']];return`<div class="nav">${items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="bottom">${mobile.map(x=>`<button class="${page===x[0]?'active':''}${x[0]==='add'?' add':''}" onclick="go('${x[0]}')"><span>${x[1]}</span><span>${x[2]}</span></button>`).join('')}</div>`}
function auth(msg=''){document.body.innerHTML=`<div style="max-width:430px;margin:60px auto;padding:18px"><div class="card"><div class="brand"><img src="./fintrack-icon-192.svg?v=29"><div class="wordmark">Fin<span>Track</span></div></div><p class="muted">Personal Finance · Cash Flow · Planning</p>${msg?`<div class="notice err">${esc(msg)}</div>`:''}<div class="field" style="margin-top:12px"><label>Email</label><input id="email" class="input" type="email"></div><div class="field" style="margin-top:9px"><label>Password</label><input id="pass" class="input" type="password"></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="login()">Sign in</button><button class="btn secondary" onclick="signup()">Create account</button></div><div id="authNote" style="margin-top:10px"></div></div></div>`;setTheme(localStorage.getItem('fintrack_theme')==='dark')}
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error)$('authNote').innerHTML=`<div class="notice err">${esc(r.error.message)}</div>`}
async function signup(){const r=await sb.auth.signUp({email:$('email').value,password:$('pass').value});$('authNote').innerHTML=r.error?`<div class="notice err">${esc(r.error.message)}</div>`:'<div class="notice ok">Account created. Check your email if confirmation is required.</div>'}
async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){auth('Supabase configuration is missing.');return}sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user)load();else auth()});const r=await sb.auth.getUser();if(r.data.user){user=r.data.user;load()}else auth()}
async function load(){const r=await sb.from('expenses').select('*').order('date',{ascending:false});if(r.error){auth(r.error.message);return}rows=r.data||[];if(!month)month=monthOf(new Date().toISOString().slice(0,10));render()}
function home(){const a=monthly(month),inc=incomeMonthly(month),inv=investmentMonthly(month),expense=total(a),income=total(inc),invest=total(inv),surplus=income-expense-invest;let fix=0,vari=0,non=0;a.forEach(x=>{const t=typeFor(x);if(t==='Fixed Recurring')fix+=Number(x.amount);else if(t==='Variable Recurring')vari+=Number(x.amount);else non+=Number(x.amount)});const cats={};a.forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));const top=Object.entries(cats).sort((x,y)=>y[1]-x[1]);const prev=total(monthly(moveMonth(month,-1)));return`<div class="monthbar"><button class="btn secondary" onclick="month=moveMonth(month,-1);render()">←</button><b>${monthLabel(month)}</b><button class="btn secondary" onclick="month=moveMonth(month,1);render()">→</button></div><div class="grid kpis"><div class="card"><div class="label">This month expenses</div><div class="value">${money(expense)}</div></div><div class="card"><div class="label">Fixed recurring</div><div class="value">${money(fix)}</div></div><div class="card"><div class="label">Variable recurring</div><div class="value">${money(vari)}</div></div><div class="card"><div class="label">Non-recurring</div><div class="value">${money(non)}</div></div></div><div class="grid kpis"><div class="card"><div class="label">Income</div><div class="value" style="color:var(--green)">${money(income)}</div></div><div class="card"><div class="label">Investments</div><div class="value" style="color:var(--gold)">${money(invest)}</div></div><div class="card"><div class="label">Monthly surplus</div><div class="value" style="color:${surplus>=0?'var(--green)':'var(--red)'}">${money(surplus)}</div></div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr))"><div class="card"><div class="section">Top categories</div>${top.length?top.slice(0,8).map(x=>`<div style="margin:11px 0"><div class="row"><span>${esc(x[0])}</span><b>${money(x[1])}</b></div><div class="progress"><i style="width:${Math.min(100,expense?x[1]/expense*100:0)}%"></i></div></div>`).join(''):'<div class="empty">No expenses this month.</div>'}</div><div class="card"><div class="section">Quick insight</div><p>${expense?`Largest category: <b>${esc(top[0]?.[0]||'—')}</b> at ${money(top[0]?.[1]||0)}.${prev?' This month is '+(expense>prev?'higher':'lower')+' than last month by '+money(Math.abs(expense-prev))+'.':' Keep logging to build a trend.'}`:'Start logging daily expenses to build useful trends and forecasts.'}</p><div class="actions"><button class="btn gold" onclick="go('add')">+ Add expense</button><button class="btn secondary" onclick="go('income')">+ Add income</button></div></div></div>`}
function add(){const e=editId?rows.find(x=>x.id===editId):null,cats=getCats(),selected=e?typeFor(e):'Auto Detect';return`<div class="card" style="max-width:760px;margin:auto"><div class="section">${e?'Edit transaction':'Add expense / investment'}</div><form onsubmit="saveExpense(event)"><div class="form"><div class="field"><label>Date</label><input id="date" class="input" type="date" value="${e?e.date:new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Amount (₹)</label><input id="amount" class="input" type="number" min="0.01" step="0.01" value="${e?e.amount:''}" required></div><div class="field"><label>Category</label><select id="category" class="select" onchange="fillSubs()" required><option value="">Select category</option>${Object.keys(cats).map(c=>`<option ${e&&e.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Sub-category</label><select id="subcategory" class="select" required><option value="">Select sub-category</option></select></div><div class="field"><label>Description</label><input id="description" class="input" value="${esc(e?.description||'')}" placeholder="e.g. Petrol / dinner"></div><div class="field"><label>Payment mode</label><select id="payment" class="select">${getPay().map(p=>`<option ${e?.payment_mode===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="span2 typebox"><label style="font-size:11px;font-weight:700">Expense Type</label><select id="expenseType" class="select" ${e?.category==='Investment'?'disabled':''}>${TYPES.map(t=>`<option ${selected===t?'selected':''}>${t}</option>`).join('')}</select><div class="muted" style="margin-top:5px">Investments are tracked separately from expenditure.</div></div></div><div class="actions" style="margin-top:14px"><button class="btn">${e?'Update':'Save'}</button>${e?`<button type="button" class="btn secondary" onclick="go('tx')">Cancel</button>`:''}</div></form></div>`}
function fillSubs(){const c=$('category')?.value,s=$('subcategory');if(!s)return;const cats=getCats();s.innerHTML='<option value="">Select sub-category</option>'+(cats[c]||[]).map(x=>`<option>${esc(x)}</option>`).join('');const e=editId&&rows.find(x=>x.id===editId);if(e&&e.category===c)s.value=e.subcategory||'';const t=$('expenseType');if(t)t.disabled=c==='Investment'}
async function saveExpense(ev){ev.preventDefault();const chosen=$('expenseType').value,row={user_id:user.id,date:$('date').value,amount:Number($('amount').value),category:$('category').value,subcategory:$('subcategory').value,description:$('description').value,payment_mode:$('payment').value};if(row.category!=='Investment'&&chosen!=='Auto Detect')row.expense_type=chosen;let r=editId?await sb.from('expenses').update(row).eq('id',editId):await sb.from('expenses').insert(row);if(r.error&&row.expense_type){delete row.expense_type;r=editId?await sb.from('expenses').update(row).eq('id',editId):await sb.from('expenses').insert(row)}if(r.error){alert(r.error.message);return}await load();go('home')}
function incomePage(){return`<div class="card" style="max-width:760px;margin:auto"><div class="section">Log income</div><form onsubmit="saveIncome(event)"><div class="form"><div class="field"><label>Date</label><input id="incomeDate" class="input" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Amount (₹)</label><input id="incomeAmount" class="input" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Income type</label><select id="incomeType" class="select">${INCOME_TYPES.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Description</label><input id="incomeDesc" class="input" placeholder="Optional note"></div></div><button class="btn" style="margin-top:14px">Save income</button></form></div><div class="card"><div class="section">Recent income</div>${rows.filter(isIncome).slice(0,8).map(x=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${x.date} · ${esc(x.subcategory||'Income')}</span><b style="color:var(--green)">${money(x.amount)}</b></div>`).join('')||'<div class="empty">No income logged yet.</div>'}</div>`}
async function saveIncome(ev){ev.preventDefault();const row={user_id:user.id,date:$('incomeDate').value,amount:Number($('incomeAmount').value),category:'Income',subcategory:$('incomeType').value,description:$('incomeDesc').value,payment_mode:'Bank Transfer'};const r=await sb.from('expenses').insert(row);if(r.error){alert(r.error.message);return}await load();go('home')}
function tx(){return`<div class="card"><div class="row"><div><div class="section">Transactions</div><div class="muted">${rows.length} records</div></div><button class="btn gold" onclick="go('add')">+ Add</button></div><div class="form" style="margin-top:12px"><input id="q" class="input" placeholder="Search" oninput="filterTx()"><select id="tm" class="select" onchange="filterTx()"><option value="all">All months</option>${[...new Set(rows.map(x=>monthOf(x.date)))].sort().reverse().map(m=>`<option value="${m}" ${m===month?'selected':''}>${monthLabel(m)}</option>`).join('')}</select></div><div id="txlist" class="tablewrap" style="margin-top:10px"></div></div>`}
function filterTx(){const q=($('q')?.value||'').toLowerCase(),m=$('tm')?.value||'all',a=rows.filter(x=>(m==='all'||monthOf(x.date)===m)&&(`${x.description||''} ${x.category||''} ${x.subcategory||''}`).toLowerCase().includes(q));$('txlist').innerHTML=a.length?`<table class="table"><thead><tr><th>Date</th><th>Category</th><th>Sub-category</th><th>Description</th><th>Amount</th><th>Type</th><th></th></tr></thead><tbody>${a.map(e=>{const t=typeFor(e),cl=t==='Income'?'income':t==='Investment'?'investment':t==='Fixed Recurring'?'fixed':t==='Variable Recurring'?'variable':'non';return`<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${esc(e.subcategory||'—')}</td><td>${esc(e.description||'—')}</td><td>${money(e.amount)}</td><td><span class="badge ${cl}">${t}</span></td><td>${!isIncome(e)?`<button class="btn secondary" style="padding:4px 7px" onclick="edit('${e.id}')">Edit</button> `:''}<button class="btn danger" style="padding:4px 7px" onclick="del('${e.id}')">×</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No matching transactions.</div>'}
function edit(id){editId=id;page='add';localStorage.setItem('fintrack_last_page','add');render()} async function del(id){if(!confirm('Delete this transaction?'))return;const r=await sb.from('expenses').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}
function weighted(vals,weights=[.55,.30,.15]){let s=0,w=0;vals.forEach((v,i)=>{if(v>0){s+=v*weights[i];w+=weights[i]}});return w?s/w:0}
function forecast(){const cm=monthOf(new Date().toISOString().slice(0,10)),m1=moveMonth(cm,-1),m2=moveMonth(cm,-2),day=new Date().getDate(),days=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();const curRaw=total(monthly(cm)),curRun=curRaw&&day>5?curRaw/day*days:curRaw,e=[curRun,total(monthly(m1)),total(monthly(m2))],i=[total(incomeMonthly(cm)),total(incomeMonthly(m1)),total(incomeMonthly(m2))],v=[total(investmentMonthly(cm)),total(investmentMonthly(m1)),total(investmentMonthly(m2))];const pe=weighted(e),pi=weighted(i),pv=weighted(v),surplus=pi-pe-pv;const score=pi>0?Math.max(0,Math.min(100,Math.round((surplus/pi)*100))):50;const monthsWithData=e.filter(x=>x>0).length,confidence=Math.min(95,35+monthsWithData*20);const cat={};[cm,m1,m2].forEach((m,idx)=>monthly(m).forEach(x=>{cat[x.category]=(cat[x.category]||0)+Number(x.amount)*([.55,.30,.15][idx])}));const cats=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,8);return`<div class="card hero"><div class="label">Projected next-month expenditure</div><div class="big">${money(pe)}</div><p class="muted">Weighted from recent spending; the current month is annualised to a full-month run rate when enough days have elapsed.</p></div><div class="grid kpis"><div class="card"><div class="label">Projected income</div><div class="value">${money(pi)}</div></div><div class="card"><div class="label">Projected investments</div><div class="value">${money(pv)}</div></div><div class="card"><div class="label">Projected surplus</div><div class="value" style="color:${surplus>=0?'var(--green)':'var(--red)'}">${money(surplus)}</div></div><div class="card"><div class="label">Spending score</div><div class="score">${score}<span style="font-size:14px;color:var(--muted)">/100</span></div></div><div class="card"><div class="label">Forecast confidence</div><div class="value">${confidence}%</div></div></div><div class="card"><div class="section">Recent monthly baseline</div><div class="tablewrap"><table class="table"><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Investments</th><th>Surplus</th></tr></thead><tbody>${[cm,m1,m2].map(m=>{const ii=total(incomeMonthly(m)),ee=total(monthly(m)),vv=total(investmentMonthly(m));return`<tr><td>${monthLabel(m)}</td><td>${money(ii)}</td><td>${money(ee)}</td><td>${money(vv)}</td><td>${money(ii-ee-vv)}</td></tr>`}).join('')}</tbody></table></div></div><div class="card"><div class="section">Projected spending by category</div>${cats.length?cats.map(x=>`<div style="margin:10px 0"><div class="row"><span>${esc(x[0])}</span><b>${money(x[1])}</b></div><div class="progress"><i style="width:${Math.min(100,pe?x[1]/pe*100:0)}%"></i></div></div>`).join(''):'<div class="empty">Keep logging expenses to build a category forecast.</div>'}</div><div class="notice">The score is a cash-flow planning score based on projected income minus projected expenses and investments. It is not an investment or credit score.</div>`}
function settings(){const setup=readSetup();return`<div class="card"><div class="section">Customize FinTrack</div><p class="muted">Add categories, sub-categories and payment methods without coding. Built-in options remain protected.</p><div class="actions"><button class="btn secondary" onclick="addCategory()">+ Category</button><button class="btn secondary" onclick="addSub()">+ Sub-category</button><button class="btn secondary" onclick="addPayment()">+ Payment method</button></div><div class="settings-list" style="margin-top:12px">${Object.keys(setup.cats||{}).length?Object.entries(setup.cats).map(([c,subs])=>`<div class="settings-item"><b>${esc(c)}</b><div class="muted">${subs.map(esc).join(' · ')||'No custom sub-categories'}</div><button class="btn danger" style="margin-top:7px;padding:6px 9px" onclick="removeCategory('${esc(c).replaceAll("'","\\'")}')">Remove</button></div>`).join(''):'<div class="empty">No custom categories yet.</div>'}</div></div><div class="card"><div class="section">Data & account</div><div class="grid kpis"><div><div class="label">All-time expenses</div><div class="value">${money(total(rows.filter(ordinary)))}</div></div><div><div class="label">All-time investments</div><div class="value">${money(total(rows.filter(isInvestment)))}</div></div><div><div class="label">All-time income</div><div class="value">${money(total(rows.filter(isIncome)))}</div></div></div><div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="csv()">Export CSV</button><button class="btn secondary" onclick="jsonExport()">Export JSON</button><button class="btn danger" onclick="sb.auth.signOut()">Sign out</button></div></div>`}
function addCategory(){const n=prompt('New category name');if(!n?.trim())return;const s=readSetup();s.cats=s.cats||{};s.cats[n.trim()]=s.cats[n.trim()]||[];localStorage.setItem(setupKey(),JSON.stringify(s));render()}
function addSub(){const c=prompt('Category name');if(!c?.trim())return;const sub=prompt('New sub-category');if(!sub?.trim())return;const s=readSetup();s.cats=s.cats||{};s.cats[c.trim()]=s.cats[c.trim()]||[];if(!s.cats[c.trim()].includes(sub.trim()))s.cats[c.trim()].push(sub.trim());localStorage.setItem(setupKey(),JSON.stringify(s));render()}
function addPayment(){const n=prompt('New payment method');if(!n?.trim())return;const s=readSetup();s.payments=s.payments||[];if(!s.payments.includes(n.trim()))s.payments.push(n.trim());localStorage.setItem(setupKey(),JSON.stringify(s));render()}
function removeCategory(c){const s=readSetup();if(!s.cats?.[c])return;delete s.cats[c];localStorage.setItem(setupKey(),JSON.stringify(s));render()}
function download(data,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function csv(){const h='Date,Category,Subcategory,Description,Amount,Payment Mode,Type\n',b=rows.map(x=>[x.date,x.category,x.subcategory||'',x.description||'',x.amount,x.payment_mode||'',typeFor(x)].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');download(h+b,'fintrack-transactions.csv','text/csv')}
function jsonExport(){download(JSON.stringify(rows,null,2),'fintrack-transactions.json','application/json')}
function render(){if(!user)return;const body=page==='home'?home():page==='add'?add():page==='tx'?tx():page==='income'?incomePage():page==='forecast'?forecast():settings();document.body.innerHTML=`<div class="app">${header()}${nav()}<main class="main">${body}</main></div>`;setTheme(localStorage.getItem('fintrack_theme')==='dark');if(page==='tx')filterTx();if(page==='add'){fillSubs();const e=editId&&rows.find(x=>x.id===editId);if(e)$('subcategory').value=e.subcategory||''}}
init();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=29',{scope:'./',updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
</script>
</body></html>
